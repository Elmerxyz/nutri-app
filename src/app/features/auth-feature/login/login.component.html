<div class="min-h-screen flex items-center justify-center bg-gradient-to-br from-primary-50 to-primary-100 px-4 sm:px-6 lg:px-8">
  <div class="w-full max-w-md space-y-8 p-8 bg-white/90 backdrop-blur-sm rounded-2xl shadow-xl border border-primary-100">
    <!-- Header -->
    <div class="text-center space-y-4">
      <i class="pi pi-whatsapp text-5xl text-primary-500"></i>
      <h2 class="text-3xl font-bold tracking-tight text-gray-900">
        ¡Bienvenido!
      </h2>
      <p class="text-sm text-gray-600">
        Inicia sesión para acceder.
      </p>
    </div>

    <!-- Botón de inicio de sesión con Google -->
    <div class="pt-2">
      <button
        class="w-full flex items-center justify-center gap-3 py-3 px-4 rounded-xl bg-primary-500 hover:bg-primary-600 text-white font-semibold shadow transition-colors"
        (click)="logInWithGoogle()"
        type="button"
      >
        <img src="https://www.svgrepo.com/show/475656/google-color.svg" alt="Google" class="w-6 h-6" />
        Iniciar sesión con Google
      </button>
    </div>
    
    <!-- Footer -->
    <div class="mt-4 text-center text-sm text-gray-600">
      <!-- <p>¿Necesitas ayuda? Contacta al administrador</p> -->
    </div>
  </div>
</div>
<p-toast [life]="4000" />
