<main class="min-h-screen bg-white dark:bg-transparent ">
  <!-- Header Section -->
  <section class="bg-white dark:bg-gray-900">
    <div class="container mx-auto px-4">
      <div>
        <h1 class="text-xl font-bold text-gray-900 dark:text-gray-100 pb-3">Contáctanos</h1>
        <p class="text-md text-gray-600 dark:text-gray-300 max-w-2xl mx-auto">
          Nuestro equipo de especialistas está aquí para ayudarte en tu journey nutricional
        </p>
      </div>
    </div>
  </section>

  <!-- Contact Cards Section -->
  <section class="container mx-auto px-4 py-12">
    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6">
      @for (contact of contacts; track contact.id) {
        <app-contact-card 
          [contact]="contact"
          (onScheduleAppointment)="onScheduleAppointment($event)"
          (onEmailClick)="onEmailClick($event)"
          (onPhoneClick)="onPhoneClick($event)"
        />
      }
    </div>
  </section>
